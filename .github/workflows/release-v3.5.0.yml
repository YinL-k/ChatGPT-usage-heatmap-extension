name: Release SakuraMeter v3.5.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v3.5.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Chrome extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist SakuraMeter-3.5.0.zip
          mkdir -p dist
          cp manifest.json dist/
          cp *.js dist/
          cp *.css dist/
          cp *.html dist/
          cp icon.png dist/
          cp privacy-policy.md dist/
          cp -R assets dist/
          cp -R _locales dist/
          cp -R locales dist/
          cd dist
          zip -r ../SakuraMeter-3.5.0.zip .
          cd ..
          unzip -l SakuraMeter-3.5.0.zip
          test "$(unzip -Z1 SakuraMeter-3.5.0.zip | grep -c '^manifest.json$')" -eq 1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.5.0
          name: SakuraMeter v3.5.0
          target_commitish: main
          generate_release_notes: true
          files: SakuraMeter-3.5.0.zip

name: Apply staged SakuraMeter 3.6.0.61
on:
  push:
    branches: [main]
    paths:
      - ".release-staging/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply SakuraMeter 3.6.0.61 source
        shell: bash
        run: |
          set -euo pipefail
          xz -dc .release-staging/sm61.tar.xz | tar -xf - -C .
          rm -rf .release-staging
          cp PRIVACY.md privacy-policy.md

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "README.md": [
                  ("**3.5.0**", "**3.6.0.61**"),
                  ("appVersion 3.5.0", "appVersion 3.6.0.61"),
              ],
              "README_en.md": [
                  ("**3.5.0**", "**3.6.0.61**"),
                  ("appVersion 3.5.0", "appVersion 3.6.0.61"),
              ],
              "INSTALL-中文.md": [
                  ("# SakuraMeter 3.5.0 安装说明", "# SakuraMeter 3.6.0.61 安装说明"),
              ],
          }

          for filename, pairs in replacements.items():
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text(encoding="utf-8")
              for old, new in pairs:
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release SakuraMeter 3.6.0.61"
          git push origin HEAD:main
